<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: одна колонка карточек 1080px; у каждой карточки справа панель решения, на телефоне — под текстом.
   Хранилище решений: артефакт Claude (db) → локальный serve.py (файл) → браузер (localStorage). */
:root{
  --bg:#f5f4f7; --surface:#ffffff; --surface-2:#f7f5fc; --line:#e8e4f2; --line-strong:#d9d3ea;
  --ink:#1f1b3a; --body:#3d3a57; --muted:#6f6a90; --faint:#9a96b0;
  --accent:#6a4fd3; --accent-ink:#4b2fd6; --accent-soft:#efeaff;
  --ok:#1f7a3a; --ok-soft:#e3f4e6; --warn:#8a5a14; --warn-soft:#fdf0dc; --bad:#c41c1c; --bad-soft:#fdecec;
  --skip:#5d5877; --skip-soft:#ecebf1;
  --shadow:0 1px 2px rgba(31,27,58,.05),0 6px 20px -14px rgba(31,27,58,.25);
  --font-display:'Onest','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1c1929; --surface-2:#231f33; --line:#2f2a44; --line-strong:#3d3757;
  --ink:#f2effc; --body:#d8d3ec; --muted:#a8a2c6; --faint:#7e789c;
  --accent:#a58cf0; --accent-ink:#cfc2f7; --accent-soft:#2b2446;
  --ok:#74d08f; --ok-soft:#1b3123; --warn:#e9b866; --warn-soft:#3a2d15; --bad:#ff8080; --bad-soft:#3d1d23;
  --skip:#b9b4d0; --skip-soft:#2a2638;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1c1929; --surface-2:#231f33; --line:#2f2a44; --line-strong:#3d3757;
  --ink:#f2effc; --body:#d8d3ec; --muted:#a8a2c6; --faint:#7e789c;
  --accent:#a58cf0; --accent-ink:#cfc2f7; --accent-soft:#2b2446;
  --ok:#74d08f; --ok-soft:#1b3123; --warn:#e9b866; --warn-soft:#3a2d15; --bad:#ff8080; --bad-soft:#3d1d23;
  --skip:#b9b4d0; --skip-soft:#2a2638;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);color:var(--ink);text-wrap:balance;margin:0}

/* head */
.head{padding-block:28px 18px;display:grid;gap:10px}
.eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:4px 12px}
.eyebrow b{font-weight:500;color:var(--body)}
h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em}
.lead{max-width:70ch;color:var(--body);margin:0}
.lead strong{color:var(--ink);font-weight:600}

/* verdict (optional block above the checklist) */
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px}
.vcol{background:var(--surface);padding:16px 18px;display:grid;gap:8px;align-content:start;min-width:0}
.vcol p{margin:0}
.vcol .vbig{font-family:var(--font-display);font-size:18px;color:var(--ink)}
.vcol .vbig b{font-weight:700;color:var(--ok)}
.vcol ul{margin:0;padding-left:18px;display:grid;gap:4px}
.vcol li b{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--ink)}
h2.findings{font-size:20px;font-weight:600;margin:0 2px 10px}

/* summary */
.summary{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;margin-bottom:12px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%;transition:width .3s ease}
.bar .s-yes{background:var(--ok)} .bar .s-no{background:var(--skip)} .bar .s-discuss{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-variant-numeric:tabular-nums}
.legend .k{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.legend .k b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.yes{background:var(--ok)} .dot.no{background:var(--skip)} .dot.discuss{background:var(--warn)} .dot.none{background:var(--line-strong)}
.save{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.save.err{color:var(--bad)}
.notice{border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.notice.info{background:var(--surface-2);color:var(--body)}

/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.seg button .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.ctl{height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:0 10px;color:var(--ink);min-width:0}
.search{flex:1 1 220px}
.btn{min-height:36px;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);text-align:left;line-height:1.3;max-width:100%}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#14121d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#14121d}}
.btn.primary:hover{filter:brightness(1.06)}
.btn.confirm{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.shown{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* sections & items */
.area{margin-top:18px;display:grid;gap:10px}
.area-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-inline:2px}
.area-head h2{font-size:18px;font-weight:600}
.area-head .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 330px;overflow:hidden}
.main{padding:16px 18px;display:grid;gap:10px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.code{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--ink);background:var(--surface-2);border-radius:6px;padding:2px 7px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.sev-3{background:var(--bad-soft);color:var(--bad)} .sev-2{background:var(--warn-soft);color:var(--warn)} .sev-1{background:var(--surface-2);color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
.tag.prob{color:var(--warn)}
.item h3{font-size:16px;line-height:22px;font-weight:600}
.txt{display:grid;gap:8px;max-width:72ch}
.txt p{margin:0}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
details{font-size:12px}
summary{cursor:pointer;color:var(--muted);width:max-content}
summary:hover{color:var(--ink)}
.where{font-family:var(--font-mono);font-size:12px;color:var(--body);margin-top:6px;overflow-wrap:anywhere}
.decide{background:var(--surface-2);padding:16px;display:grid;gap:10px;align-content:start;min-width:0;border-left:1px solid var(--line);transition:background .2s ease}
.item[data-status="yes"] .decide{background:var(--ok-soft)}
.item[data-status="no"] .decide{background:var(--skip-soft)}
.item[data-status="discuss"] .decide{background:var(--warn-soft)}
.item[data-status="no"] h3{color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:11px;padding:3px}
.choices button{min-width:0;border:0;border-radius:8px;padding:7px 2px;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.choices button:hover{color:var(--ink);background:var(--surface-2)}
.choices button svg{width:14px;height:14px;flex:none}
.choices button[aria-pressed="true"][data-v="yes"]{background:var(--ok);color:#fff}
.choices button[aria-pressed="true"][data-v="no"]{background:var(--skip);color:var(--surface)}
.choices button[aria-pressed="true"][data-v="discuss"]{background:var(--warn);color:#fff}
:root[data-theme="dark"] .choices button[aria-pressed="true"][data-v="yes"],:root[data-theme="dark"] .choices button[aria-pressed="true"][data-v="discuss"]{color:#14121d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .choices button[aria-pressed="true"][data-v="yes"],:root:not([data-theme="light"]) .choices button[aria-pressed="true"][data-v="discuss"]{color:#14121d}}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--ink);line-height:1.45}
textarea::placeholder{color:var(--faint)}
.state{font-size:12px;color:var(--muted);min-height:16px}
.empty{background:var(--surface);border-radius:16px;padding:28px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.foot{margin-top:28px;color:var(--muted);font-size:12px;max-width:72ch}
@media (max-width:760px){
  .item{grid-template-columns:minmax(0,1fr)}
  .decide{border-left:0;border-top:1px solid var(--line)}
  h1{font-size:24px;line-height:30px}
  .toolbar{position:static}
  .save{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__TITLE__</h1>
    <p class="lead">__INTRO__ У каждого пункта выберите <strong>«Делаем»</strong>, <strong>«Не делаем»</strong> или <strong>«Обсудить»</strong>; комментарий — по желанию. Всё сохраняется само. Когда закончите, напишите в чат «готово» — соберу следующий шаг только из согласованного.</p>
  </header>

__VERDICT__
  <section class="summary" aria-label="Итоги решений">
    <div class="bar" id="bar" aria-hidden="true"><span class="s-yes"></span><span class="s-no"></span><span class="s-discuss"></span></div>
    <div class="legend" id="legend"></div>
    <div class="notice" id="notice" hidden></div>
  </section>

  <div class="toolbar" id="toolbar">
    <div class="seg" id="areas" aria-label="Область"></div>
    <div class="row">
      <div class="seg" id="sevs" aria-label="Важность"></div>
      <select class="ctl" id="cat" aria-label="Категория"></select>
      <select class="ctl" id="dec" aria-label="Решение">
        <option value="">Все решения</option>
        <option value="none">Без решения</option>
        <option value="yes">Делаем</option>
        <option value="no">Не делаем</option>
        <option value="discuss">Обсудить</option>
        <option value="comment">С комментарием</option>
      </select>
      <input class="ctl search" id="q" type="search" placeholder="Поиск по тексту и файлам" aria-label="Поиск">
    </div>
    <div class="row">
      <button class="btn primary" id="bulk" type="button"></button>
      <button class="btn" id="copy" type="button">Скопировать решения</button>
      <button class="btn" id="download" type="button" hidden>Скачать решения</button>
      <span class="shown" id="shown"></span>
    </div>
  </div>

  <main id="list"></main>
  <p class="foot">__FOOT__</p>
</div>

<script type="application/json" id="items">__ITEMS__</script>
<script type="application/json" id="config">__CONFIG__</script>
<script>
(function(){
  var ITEMS = JSON.parse(document.getElementById('items').textContent);
  var CFG = JSON.parse(document.getElementById('config').textContent);
  var AREAS = CFG.areas;
  var SEV = {3:'Высокая',2:'Средняя',1:'Низкая'}, SEVOF = {3:'Высокой',2:'Средней',1:'Низкой'};
  var STATUS = {yes:'Делаем',no:'Не делаем',discuss:'Обсудить'};
  var ICONS = {
    yes:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
    no:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h8"/></svg>',
    discuss:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6.2a2 2 0 1 1 2.8 1.8c-.5.2-.8.6-.8 1.1V10"/><path d="M8 12.6v.1"/></svg>'
  };
  var decisions = {};        // id -> {status, comment}
  var pending = {};          // id -> number of writes in flight
  var queue = Promise.resolve(); // writes go one at a time
  var timers = {};
  var db = null, mode = 'loading';
  var filter = {area:'', sev:'', cat:'', dec:'', q:''};
  var LSK = CFG.key + '-filter-v1', LSD = CFG.key + '-decisions-v1';

  try { var saved = JSON.parse(localStorage.getItem(LSK) || 'null'); if (saved) Object.assign(filter, saved, {q:''}); } catch(e) {}

  var $ = function(id){ return document.getElementById(id); };
  var norm = function(s){ return String(s || '').toLocaleLowerCase('ru-RU').replace(/ё/g,'е'); };
  function plural(n, one, few, many){ var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ---------- build cards once ----------
  var cards = {}, sections = {};
  var list = $('list');
  AREAS.forEach(function(a){
    var sec = document.createElement('section');
    sec.className = 'area'; sec.setAttribute('aria-labelledby','h-'+a[0]);
    var items = ITEMS.filter(function(i){ return i.area === a[0]; });
    sec.innerHTML = '<div class="area-head"><h2 id="h-'+a[0]+'">'+esc(a[1])+'</h2><span class="meta" data-meta></span></div>';
    items.forEach(function(it){
      var el = document.createElement('article');
      el.className = 'item'; el.id = 'item-'+it.id; el.dataset.status = '';
      el.innerHTML =
        '<div class="main">'+
          '<div class="tags"><span class="code">'+esc(it.code)+'</span><span class="pill sev-'+it.sev+'">'+SEV[it.sev]+'</span>'+
          '<span class="tag">'+esc(it.cat)+'</span><span class="tag">· объём '+esc(it.effort)+'</span>'+
          (it.conf === 'вероятно' ? '<span class="tag prob">· вероятно</span>' : '')+'</div>'+
          '<h3>'+esc(it.title)+'</h3>'+
          '<div class="txt"><p><span class="lbl">Что не так</span>'+esc(it.problem)+'</p>'+
          '<p><span class="lbl">Предлагаю</span>'+esc(it.fix)+'</p></div>'+
          '<details><summary>Где в коде</summary><div class="where">'+esc(it.where)+'</div></details>'+
        '</div>'+
        '<div class="decide">'+
          '<div class="choices" role="group" aria-label="Решение по '+esc(it.code)+'">'+
            ['yes','no','discuss'].map(function(v){ return '<button type="button" data-v="'+v+'" aria-pressed="false">'+ICONS[v]+STATUS[v]+'</button>'; }).join('')+
          '</div>'+
          '<label class="lbl" for="c-'+it.id+'">Комментарий</label>'+
          '<textarea id="c-'+it.id+'" rows="2" placeholder="'+esc(CFG.placeholder)+'"></textarea>'+
          '<div class="state" aria-live="polite"></div>'+
        '</div>';
      el.querySelectorAll('.choices button').forEach(function(b){
        b.addEventListener('click', function(){
          var cur = (decisions[it.id] || {}).status || '';
          var v = b.dataset.v === cur ? '' : b.dataset.v;
          setDecision(it.id, {status:v});
        });
      });
      var ta = el.querySelector('textarea');
      ta.addEventListener('input', function(){
        var d = decisions[it.id] || {status:'',comment:''};
        decisions[it.id] = {status:d.status||'', comment:ta.value};
        clearTimeout(timers[it.id]);
        timers[it.id] = setTimeout(function(){ persist(it.id); }, 800);
        stateText(it.id, 'Не сохранено…');
        refreshSummary();
      });
      ta.addEventListener('blur', function(){
        if (timers[it.id]) { clearTimeout(timers[it.id]); timers[it.id] = null; persist(it.id); }
      });
      cards[it.id] = el;
      sec.appendChild(el);
    });
    sections[a[0]] = sec;
    list.appendChild(sec);
  });
  var emptyEl = document.createElement('div');
  emptyEl.className = 'empty'; emptyEl.hidden = true;
  emptyEl.textContent = 'Под фильтры ничего не попало. Сбросьте поиск или выберите «Все».';
  list.appendChild(emptyEl);

  // ---------- filters ----------
  function segButtons(el, opts, key){
    el.innerHTML = opts.map(function(o){ return '<button type="button" data-v="'+o[0]+'" aria-pressed="false">'+esc(o[1])+'<span class="n" data-n="'+o[0]+'"></span></button>'; }).join('');
    el.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){ filter[key] = b.dataset.v; saveFilter(); apply(); });
    });
  }
  segButtons($('areas'), [['','Все']].concat(AREAS.map(function(a){ return [a[0], a[1].split(':')[0].split(',')[0]]; })), 'area');
  var sevs = Array.from(new Set(ITEMS.map(function(i){ return i.sev; }))).sort().reverse();
  segButtons($('sevs'), [['','Любая важность']].concat(sevs.map(function(s){ return [String(s), SEV[s]]; })), 'sev');
  var cats = Array.from(new Set(ITEMS.map(function(i){ return i.cat; }))).sort();
  $('cat').innerHTML = '<option value="">Все категории</option>' + cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
  $('cat').addEventListener('change', function(e){ filter.cat = e.target.value; saveFilter(); apply(); });
  $('dec').addEventListener('change', function(e){ filter.dec = e.target.value; saveFilter(); apply(); });
  $('q').addEventListener('input', function(e){ filter.q = e.target.value; apply(); });
  function saveFilter(){ try { localStorage.setItem(LSK, JSON.stringify({area:filter.area,sev:filter.sev,cat:filter.cat,dec:filter.dec})); } catch(e) {} }

  function matches(it, ignore){
    var d = decisions[it.id] || {};
    if (ignore !== 'area' && filter.area && it.area !== filter.area) return false;
    if (ignore !== 'sev' && filter.sev && String(it.sev) !== filter.sev) return false;
    if (filter.cat && it.cat !== filter.cat) return false;
    if (filter.dec === 'none' && d.status) return false;
    if (filter.dec === 'comment' && !(d.comment || '').trim()) return false;
    if (filter.dec && filter.dec !== 'none' && filter.dec !== 'comment' && d.status !== filter.dec) return false;
    if (filter.q) {
      var hay = norm([it.code, it.title, it.problem, it.fix, it.where, it.cat, d.comment].join(' '));
      var words = norm(filter.q).split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return false;
    }
    return true;
  }
  var bulkArmed = false;
  function visibleUndecided(){ return ITEMS.filter(function(it){ return matches(it) && !(decisions[it.id] || {}).status; }); }
  function apply(){
    var shown = 0;
    ITEMS.forEach(function(it){ var ok = matches(it); cards[it.id].hidden = !ok; if (ok) shown++; });
    AREAS.forEach(function(a){
      var its = ITEMS.filter(function(i){ return i.area === a[0]; });
      var vis = its.filter(function(i){ return !cards[i.id].hidden; });
      sections[a[0]].hidden = vis.length === 0;
      var done = its.filter(function(i){ return (decisions[i.id] || {}).status; }).length;
      sections[a[0]].querySelector('[data-meta]').textContent = its.length + ' ' + plural(its.length, 'пункт', 'пункта', 'пунктов') + ' · решено ' + done + (vis.length !== its.length ? ' · показано ' + vis.length : '');
    });
    emptyEl.hidden = shown !== 0;
    $('shown').textContent = 'Показано ' + shown + ' из ' + ITEMS.length;
    $('areas').querySelectorAll('button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.v === filter.area));
      b.querySelector('.n').textContent = ITEMS.filter(function(it){ return (!b.dataset.v || it.area === b.dataset.v) && matches(it, 'area'); }).length;
    });
    $('sevs').querySelectorAll('button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.v === filter.sev));
      b.querySelector('.n').textContent = ITEMS.filter(function(it){ return (!b.dataset.v || String(it.sev) === b.dataset.v) && matches(it, 'sev'); }).length;
    });
    $('cat').value = filter.cat; $('dec').value = filter.dec;
    bulkArmed = false; renderBulk();
  }
  function renderBulk(){
    var n = visibleUndecided().length, b = $('bulk');
    b.disabled = n === 0 || mode === 'loading';
    b.className = 'btn ' + (bulkArmed ? 'confirm' : 'primary');
    b.textContent = bulkArmed ? 'Точно? Отметить «Делаем» у ' + n : '«Делаем» всем показанным без решения · ' + n;
  }
  $('bulk').addEventListener('click', function(){
    if (!bulkArmed) { bulkArmed = true; renderBulk(); return; }
    bulkArmed = false;
    visibleUndecided().forEach(function(it){ setDecision(it.id, {status:'yes'}); });
    renderBulk();
  });
  $('bulk').addEventListener('blur', function(){ if (bulkArmed) { bulkArmed = false; renderBulk(); } });

  // ---------- state ----------
  function stateText(id, t){ var s = cards[id] && cards[id].querySelector('.state'); if (s) s.textContent = t || ''; }
  function paint(id){
    var d = decisions[id] || {status:'',comment:''}, el = cards[id];
    if (!el) return;
    el.dataset.status = d.status || '';
    el.querySelectorAll('.choices button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === d.status)); });
    var ta = el.querySelector('textarea');
    if (document.activeElement !== ta && !timers[id] && ta.value !== (d.comment || '')) ta.value = d.comment || '';
  }
  function setDecision(id, patch){
    var d = decisions[id] || {status:'',comment:''};
    var ta = cards[id].querySelector('textarea');
    decisions[id] = {status: patch.status !== undefined ? patch.status : (d.status||''), comment: ta.value};
    clearTimeout(timers[id]); timers[id] = null;
    paint(id); refreshSummary(); persist(id);
    if (filter.dec) apply(); else renderBulk();
  }
  function persist(id){
    var body = {status: decisions[id].status || '', comment: decisions[id].comment || '', at: new Date().toISOString()};
    timers[id] = null;
    if (mode === 'db' || mode === 'file') {
      pending[id] = (pending[id] || 0) + 1; stateText(id, 'Сохраняю…'); refreshSave();
      queue = queue.then(function(){
        if (mode === 'db') return db.collection('decisions').doc(id).set(body);
        return fetch(API + '/' + encodeURIComponent(id), {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
          .then(function(r){ if (!r.ok) throw {code:'http_' + r.status}; });
      }).then(function(){
        pending[id]--; if (!pending[id]) stateText(id, 'Сохранено'); refreshSave();
      }, function(err){
        pending[id]--; stateText(id, 'Не сохранилось — нажмите решение ещё раз'); saveError(err); refreshSave();
      });
    } else {
      try { var all = JSON.parse(localStorage.getItem(LSD) || '{}'); all[id] = body; localStorage.setItem(LSD, JSON.stringify(all)); stateText(id, 'Сохранено в этом браузере'); }
      catch(e) { stateText(id, 'Не сохранилось'); }
    }
  }
  var lastErr = null;
  function saveError(err){ lastErr = err && err.code || 'error'; }
  function refreshSave(){
    var busy = Object.keys(pending).some(function(k){ return pending[k] > 0; });
    var s = $('save');
    if (!s) return;
    s.className = 'save' + (lastErr && !busy ? ' err' : '');
    s.textContent = mode === 'loading' ? 'Подключаюсь к хранилищу…' : mode === 'local' ? 'Решения сохраняются только в этом браузере' : busy ? 'Сохраняю…' : lastErr ? 'Часть решений не сохранилась' : mode === 'file' ? 'Все решения сохранены в файл' : 'Все решения сохранены';
  }
  function refreshSummary(){
    var c = {yes:0,no:0,discuss:0,none:0}, comments = 0;
    ITEMS.forEach(function(it){ var d = decisions[it.id] || {}; c[d.status || 'none']++; if ((d.comment || '').trim()) comments++; });
    var n = ITEMS.length, spans = $('bar').children;
    spans[0].style.width = (c.yes/n*100)+'%'; spans[1].style.width = (c.no/n*100)+'%'; spans[2].style.width = (c.discuss/n*100)+'%';
    var top = Math.max.apply(null, ITEMS.map(function(it){ return it.sev; })), high = ITEMS.filter(function(it){ return it.sev === top; }).length;
    $('legend').innerHTML =
      '<span class="k"><span class="dot yes"></span>Делаем <b>'+c.yes+'</b></span>'+
      '<span class="k"><span class="dot no"></span>Не делаем <b>'+c.no+'</b></span>'+
      '<span class="k"><span class="dot discuss"></span>Обсудить <b>'+c.discuss+'</b></span>'+
      '<span class="k"><span class="dot none"></span>Без решения <b>'+c.none+'</b> из '+n+'</span>'+
      '<span class="k">Комментариев <b>'+comments+'</b></span>'+
      '<span class="k">'+SEVOF[top]+' важности <b>'+high+'</b></span>'+
      '<span class="save" id="save" aria-live="polite"></span>';
    refreshSave();
  }

  // ---------- copy fallback ----------
  $('copy').addEventListener('click', function(){
    var lines = ITEMS.map(function(it){
      var d = decisions[it.id] || {};
      return it.code + ' — ' + (STATUS[d.status] || 'без решения') + ((d.comment || '').trim() ? ' — ' + d.comment.trim().replace(/\s+/g,' ') : '');
    }).join('\n');
    var btn = $('copy');
    var done = function(t){ btn.textContent = t; setTimeout(function(){ btn.textContent = 'Скопировать решения'; }, 1800); };
    try {
      navigator.clipboard.writeText(lines).then(function(){ done('Скопировано'); }, function(){ fallbackCopy(lines); done('Выделено — нажмите Ctrl+C'); });
    } catch(e) { fallbackCopy(lines); done('Выделено — нажмите Ctrl+C'); }
  });
  function exportJson(){
    var out = {};
    ITEMS.forEach(function(it){ var d = decisions[it.id]; if (d && (d.status || (d.comment || '').trim())) out[it.id] = {code: it.code, status: d.status || '', comment: d.comment || ''}; });
    return JSON.stringify(out, null, 1);
  }
  $('download').addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([exportJson()], {type:'application/json'}));
    a.download = CFG.key + '-decisions.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  function fallbackCopy(text){
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e) {} setTimeout(function(){ ta.remove(); }, 2000);
  }

  // ---------- storage ----------
  var API = 'api/' + encodeURIComponent(CFG.key) + '/decisions';
  function load(all){
    Object.keys(all || {}).forEach(function(id){ if (!cards[id]) return; decisions[id] = {status: all[id].status || '', comment: all[id].comment || ''}; paint(id); });
  }
  function useLocal(reason){
    mode = 'local';
    try { load(JSON.parse(localStorage.getItem(LSD) || '{}')); } catch(e) {}
    var n = $('notice'); n.hidden = false; n.className = 'notice' + (reason ? '' : ' info');
    var inArtifact = !!window.claude; // в артефакте скачивание заблокировано — только копирование
    n.textContent = (reason ? reason + ' ' : '') + 'Решения сохраняются только в этом браузере. Когда закончите, нажмите «Скопировать решения» и вставьте текст в чат' + (inArtifact ? '.' : ' или «Скачать решения» и скажите, где лежит файл.');
    $('download').hidden = inArtifact;
    refreshSummary(); apply();
  }
  function useFile(all){
    mode = 'file'; load(all);
    $('download').hidden = false;
    refreshSummary(); apply();
  }
  function tryServer(){
    if (!/^https?:$/.test(location.protocol)) { useLocal(''); return; }
    fetch(API, {cache:'no-store'}).then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(useFile, function(){ useLocal(''); });
  }
  refreshSummary(); apply();
  var started = false;
  function start(){
    if (started) return; started = true;
    if (!window.claude || typeof window.claude.use !== 'function') { tryServer(); return; }
    window.claude.use('db').then(function(d){
      if (!d) { useLocal('Хранилище артефакта недоступно в этом окне.'); return; }
      db = d; mode = 'db';
      db.collection('decisions').onSnapshot(function(snap){
        snap.docs.forEach(function(doc){
          if (!doc.exists) return;
          var id = doc.id, v = doc.data() || {};
          if (!cards[id] || pending[id] > 0 || timers[id]) return;
          var ta = cards[id].querySelector('textarea');
          decisions[id] = {status: v.status || '', comment: document.activeElement === ta ? ta.value : (v.comment || '')};
          paint(id);
        });
        refreshSummary(); apply();
      }, function(err){ lastErr = err && err.code; refreshSave(); });
      refreshSummary(); renderBulk();
    }, function(){ useLocal('Хранилище артефакта недоступно.'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
