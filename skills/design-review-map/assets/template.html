<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap">
<style>
/* Дизайн-ревью стопкой: скриншот экрана, свайп вправо «Принять», влево «Доработать».
   Данные экранов — в <script id="review-data">, их подставляет scripts/build.py.
   Хранилище решений: артефакт Claude (db) → локальный serve.py (файл) → браузер (localStorage).
   Иконки — Phosphor Icons (MIT), встроены SVG-спрайтом, без внешних запросов.

   Радиусы, одна система на всю страницу:
   --r-card 24px  поверхности: карточка стопки, шторка, панель, меню, окно текста, кроп, многострочное поле
   --r-in   14px  область скриншота внутри карточки и кроп внутри панели (24 минус внутренний отступ 10)
   --r-img   8px  сам скриншот и миниатюры
   --r-pill 999px все интерактивные элементы: кнопки, чипсы, выбор точки, тост, бейджи, точки на макете */
:root{
  color-scheme:light;
  --bg:#f5f4f7; --surface:#fdfcff; --popup:#fdfcff; --ink:#1f1b3a; --ink2:#3d3a57; --muted:#6f6a90;
  --border:#e8e4f2; --line:#ddd8ea; --chip-b:#cfc8e2; --shot-bg:#eceaf2; --hover:#f0eef6;
  --accent:#6a4fd3; --accent-h:#5d43c6; --soft:#efeaff; --soft-h:#e5dcff; --on-soft:#4b2fd6; --on-accent:#fdfcff; --ring:#6a4fd3;
  --ok:#1f7a3a; --ok-bg:#e3f4e6; --warn:#8a5a14; --warn-bg:#fdf0dc; --pin:#e9a23b; --pin-ink:#1f1b3a; --pin-edge:#fdfcff;
  --toast-bg:#1f1b3a; --toast-ink:#f3f1fa; --toast-act:#d6caff; --toast-b:transparent;
  --sh-card:0 1px 2px rgba(31,27,58,.06), 0 18px 40px -18px rgba(31,27,58,.30);
  --sh-pop:0 2px 6px rgba(31,27,58,.08), 0 24px 56px -20px rgba(31,27,58,.34);
  --sh-sheet:0 -16px 40px -26px rgba(31,27,58,.34);
  --sh-pin:0 3px 8px rgba(31,27,58,.32);
  --r-card:24px; --r-in:14px; --r-img:8px; --r-pill:999px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0e17; --surface:#17151f; --popup:#1e1b29; --ink:#f3f1fa; --ink2:#c9c5da; --muted:#9a95b3;
    --border:#2a2638; --line:#332e45; --chip-b:#3d3654; --shot-bg:#1e1b29; --hover:#221f2e;
    --accent:#8f75ec; --accent-h:#a58cf0; --soft:#2b2346; --soft-h:#342a56; --on-soft:#cbbcf8; --on-accent:#0f0e17; --ring:#a58cf0;
    --ok:#5fcf8c; --ok-bg:#163024; --warn:#f0b866; --warn-bg:#33260f; --pin-edge:#17151f;
    --toast-bg:#1e1b29; --toast-ink:#f3f1fa; --toast-act:#cbbcf8; --toast-b:#2a2638;
    --sh-card:0 1px 2px rgba(6,5,12,.5), 0 18px 40px -18px rgba(6,5,12,.8);
    --sh-pop:0 2px 6px rgba(6,5,12,.5), 0 24px 56px -20px rgba(6,5,12,.85);
    --sh-sheet:0 -16px 40px -24px rgba(6,5,12,.9);
    --sh-pin:0 3px 8px rgba(6,5,12,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0e17; --surface:#17151f; --popup:#1e1b29; --ink:#f3f1fa; --ink2:#c9c5da; --muted:#9a95b3;
  --border:#2a2638; --line:#332e45; --chip-b:#3d3654; --shot-bg:#1e1b29; --hover:#221f2e;
  --accent:#8f75ec; --accent-h:#a58cf0; --soft:#2b2346; --soft-h:#342a56; --on-soft:#cbbcf8; --on-accent:#0f0e17; --ring:#a58cf0;
  --ok:#5fcf8c; --ok-bg:#163024; --warn:#f0b866; --warn-bg:#33260f; --pin-edge:#17151f;
  --toast-bg:#1e1b29; --toast-ink:#f3f1fa; --toast-act:#cbbcf8; --toast-b:#2a2638;
  --sh-card:0 1px 2px rgba(6,5,12,.5), 0 18px 40px -18px rgba(6,5,12,.8);
  --sh-pop:0 2px 6px rgba(6,5,12,.5), 0 24px 56px -20px rgba(6,5,12,.85);
  --sh-sheet:0 -16px 40px -24px rgba(6,5,12,.9);
  --sh-pin:0 3px 8px rgba(6,5,12,.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
/* форма открыта: документ не прокручивается */
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:block;flex:none;width:1em;height:1em;fill:currentColor}

/* ---------- кнопки ---------- */
.btn{
  appearance:none;border:0;background:transparent;color:var(--ink);cursor:pointer;
  height:48px;padding:0 22px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:700 16px/1 var(--font);white-space:nowrap;text-decoration:none;
  transition:transform .14s var(--ease);user-select:none;-webkit-user-select:none;
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn .ic{font-size:20px}
.btn-lg{height:56px;font-size:17px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-h)}
.btn-soft{background:var(--soft);color:var(--on-soft)}
.btn-soft:hover{background:var(--soft-h)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--chip-b);color:var(--ink)}
.btn-line:hover,.btn-ghost:hover{background:var(--hover)}
.btn-ghost{color:var(--ink2);padding:0 16px}
.btn-icon{width:48px;padding:0}
.btn-icon .ic{font-size:24px}

/* ---------- шапка ---------- */
.hd{flex:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:calc(var(--sat) + 4px) var(--gr) 4px var(--gl)}
.hd-t{margin:0;font:700 17px/1.2 var(--font);letter-spacing:-.01em;white-space:nowrap}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font:600 14px/1 var(--font);color:var(--muted);white-space:nowrap}
.prog b{color:var(--ink);font-weight:700}
.bar{display:flex;gap:3px;width:96px;height:5px}
.bar i{flex:1;border-radius:var(--r-pill);background:var(--line)}
.bar i.ok{background:var(--ok)} .bar i.fix{background:var(--warn)}
.menu-w{position:relative;margin-right:-8px}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:248px;padding:8px;display:grid;gap:2px;
  background:var(--popup);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-pop);
  transform-origin:100% 0;animation:menuIn .18s var(--ease)}
.menu[hidden]{display:none}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.mi{appearance:none;border:0;background:none;height:48px;border-radius:var(--r-pill);padding:0 18px;display:flex;align-items:center;
  font:600 16px/1 var(--font);color:var(--ink);text-decoration:none;cursor:pointer;text-align:left;width:100%}
.mi:hover{background:var(--hover)}
.mi[hidden]{display:none}
.menu hr{border:0;height:1px;background:var(--border);margin:4px 12px}
.mi-note{margin:0;padding:8px 18px 6px;font:600 14px/1.4 var(--font);color:var(--muted)}
.mi-note.err{color:var(--warn)}

/* ---------- стопка ---------- */
.main{flex:1;min-height:0;position:relative;padding:6px var(--gr) 12px var(--gl)}
.deck{position:relative;height:100%}
.deck[hidden]{display:none}
.card{
  position:absolute;top:0;left:50%;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-card);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;cursor:grab;
}
.card.dragging{cursor:grabbing}
.card.under{transform-origin:50% 100%;pointer-events:none;box-shadow:0 1px 2px rgba(31,27,58,.05)}
.card.under>.card-shot,.card.under>.card-info{opacity:calc(.5 + .5 * var(--d, 0))}
.card-shot{flex:1;min-height:0;margin:10px 10px 0;border-radius:var(--r-in);background:var(--shot-bg);display:flex;align-items:center;justify-content:center;position:relative;cursor:zoom-in}
/* длинный скриншот: по ширине карточки, листается внутри */
.card-shot.tall{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.card-shot.tall .frame{margin:12px auto 40px}
.card-shot.tall::after{content:'';position:sticky;display:block;bottom:0;height:40px;margin-top:-40px;background:linear-gradient(to bottom, transparent, var(--shot-bg));pointer-events:none}
.zoom-btn{appearance:none;border:0;position:absolute;top:20px;right:20px;z-index:2;width:44px;height:44px;border-radius:var(--r-pill);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--popup);box-shadow:0 0 0 1px var(--border), var(--sh-pop);transition:transform .14s var(--ease)}
.zoom-btn:active{transform:scale(.94)}
.zoom-btn .ic{font-size:22px}
.frame{position:relative;flex:none}
.frame>img{display:block;width:100%;height:100%;border-radius:var(--r-img);box-shadow:0 1px 3px rgba(31,27,58,.12);pointer-events:none;-webkit-user-drag:none}
.pins{position:absolute;inset:0;pointer-events:none}
.card-info{flex:none;position:relative;padding:14px 20px 20px}
.card-meta{display:flex;align-items:center;gap:8px;min-height:28px}
.code{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:var(--r-pill);background:var(--soft);color:var(--on-soft);font:700 14px/1 var(--font);flex:none}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:var(--r-pill);font:700 13px/1 var(--font);white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-fix{background:var(--warn-bg);color:var(--warn)}
.pos{margin-left:auto;font:600 14px/1 var(--font);color:var(--muted);white-space:nowrap}
.card-t{margin:10px 0 0;font:700 19px/1.3 var(--font);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-note{margin:6px 0 0;font:400 15px/1.45 var(--font);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* описание не влезло: «Ещё» поверх конца последней строки, раскрытое описание закрывает низ скриншота и листается */
.note-more{display:none;appearance:none;border:0;cursor:pointer;position:absolute;right:20px;bottom:20px;height:22px;padding:0 0 0 36px;
  background:linear-gradient(to right, transparent, var(--surface) 30px);color:var(--on-soft);font:700 15px/22px var(--font)}
.card.has-more .note-more{display:block}
.card.has-more .card-note,.card.has-more .card-t{cursor:pointer}
.card.info-open .card-info{position:absolute;left:0;right:0;bottom:0;z-index:2;max-height:calc(100% - 72px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-top:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-sheet)}
.card.info-open .card-t{white-space:normal}
.card.info-open .card-note{display:block;overflow:visible;-webkit-line-clamp:unset}
.card.info-open .note-more{position:static;height:44px;margin-top:6px;padding:0;background:none}
.stamp{position:absolute;top:22px;z-index:3;padding:9px 18px;border-radius:var(--r-pill);border:2.5px solid;font:700 20px/1 var(--font);opacity:0;pointer-events:none;white-space:nowrap}
.st-ok{left:22px;color:var(--ok);border-color:var(--ok);background:var(--ok-bg);transform:rotate(-8deg)}
.st-fix{right:22px;color:var(--warn);border-color:var(--warn);background:var(--warn-bg);transform:rotate(8deg)}

/* точки на макете */
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:var(--r-pill);background:var(--pin);color:var(--pin-ink);
  font:700 14px/28px var(--font);text-align:center;box-shadow:0 0 0 2px var(--pin-edge), var(--sh-pin);transform:scale(var(--pz, 1));transition:transform .2s var(--ease)}
.pin.on{transform:scale(calc(var(--pz, 1) * 1.14));box-shadow:0 0 0 2px var(--pin-edge), 0 0 0 5px var(--accent), var(--sh-pin);z-index:2}
.pin.pop{animation:pop .42s var(--ease)}
@keyframes pop{0%{transform:scale(calc(var(--pz, 1) * .2));opacity:0}55%{transform:scale(calc(var(--pz, 1) * 1.3));opacity:1}100%{transform:scale(calc(var(--pz, 1) * 1.14))}}

/* слой увеличения: внутри рамки, сдвиг и кратность задаёт Zoom */
.zl{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.zl>img{display:block;width:100%;height:100%;border-radius:var(--r-img);box-shadow:var(--sh-card);pointer-events:none;-webkit-user-drag:none;user-select:none}

/* ---------- нижняя панель ---------- */
.dock{flex:none;display:grid;gap:8px;padding:0 var(--gr) calc(12px + var(--sab)) var(--gl)}
.dock-nav{display:flex;justify-content:space-between;align-items:center;height:48px}
.dock-nav .btn{padding:0 14px 0 10px}
.dock-nav [data-nav="1"]{padding:0 10px 0 14px}
.dock-hint{display:none;font:600 14px/1.3 var(--font);color:var(--muted);text-align:center}
.dock-dec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock-dec .btn{width:100%;will-change:transform;transition:none}
body.is-done .dock{display:none}

/* ---------- тост ---------- */
.toast{position:fixed;z-index:70;left:var(--gl);right:var(--gr);bottom:calc(76px + var(--sab));min-height:48px;
  display:flex;align-items:center;gap:8px;padding:4px 6px 4px 20px;border-radius:var(--r-pill);
  background:var(--toast-bg);color:var(--toast-ink);border:1px solid var(--toast-b);box-shadow:var(--sh-pop);
  font:600 15px/1.2 var(--font);opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;
  transition:opacity .2s var(--ease), transform .26s var(--ease)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast-t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast .btn{height:38px;padding:0 16px;color:var(--toast-act);font-size:15px}
.toast .btn:hover{background:rgba(201,197,218,.14)}
.toast .btn[hidden]{display:none}

/* ---------- итоги ---------- */
.done-w{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:8px var(--gr) calc(24px + var(--sab)) var(--gl)}
.done-w[hidden]{display:none}
.done{max-width:560px;margin:0 auto;padding-top:12px}
.done-h{margin:0;font:700 26px/1.2 var(--font);letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stat{border-radius:var(--r-card);padding:18px 20px}
.stat b{display:block;font:700 40px/1 var(--font);letter-spacing:-.02em}
.stat span{display:block;margin-top:8px;font:600 15px/1.2 var(--font)}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-fix{background:var(--warn-bg);color:var(--warn)}
.done-save{margin:10px 0 0;font:400 15px/1.45 var(--font);color:var(--muted)}
.done-save.err{color:var(--warn)}
.done-sub{margin:28px 0 4px;font:700 15px/1.2 var(--font);color:var(--muted)}
.dl{list-style:none;margin:0;padding:0}
.dl li+li{border-top:1px solid var(--border)}
.di{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:14px;padding:12px 4px;text-align:left;cursor:pointer;border-radius:var(--r-pill);color:var(--ink)}
.di:hover{background:var(--hover)}
.dthumb{flex:none;width:72px;height:64px;display:flex;align-items:center;justify-content:center}
.dthumb img{display:block;width:48px;height:64px;object-fit:cover;object-position:50% 0;border-radius:var(--r-img);background:var(--shot-bg);box-shadow:0 0 0 1px var(--border)}
.dthumb.wide img{width:72px;height:45px}
.di-t{flex:1;min-width:0;display:grid;gap:3px}
.di-t b{font:700 16px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-t span{font:400 14px/1.4 var(--font);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.di .ic{font-size:20px;color:var(--muted)}
.done-act{display:grid;gap:8px;margin-top:24px}

/* ---------- доработка: одна фиксированная оболочка на весь экран ---------- */
.rw{position:fixed;z-index:50;left:0;right:0;top:0;bottom:0;height:100vh;height:100dvh;height:var(--vvh,100dvh);transform:translateY(var(--vvt,0px));overflow:hidden;overscroll-behavior:none}
.rw[hidden]{display:none}
.rw-bg{position:absolute;inset:0;background:var(--bg);opacity:0}
/* скриншот сверху; его высота не зависит от клавиатуры, поэтому поле всегда в верхней половине экрана */
.rw{--shot-h:clamp(132px, 25vh, 280px)}
.rw-stage{position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 12px + var(--shot-h));padding:calc(var(--sat) + 12px) var(--gr) 0 var(--gl);display:flex;flex-direction:column}
.rw-fit{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.rw-fit.zoomed{overflow:hidden;border-radius:var(--r-in)}
.rw-frame{position:relative;flex:none;cursor:crosshair;transform-origin:50% 50%;will-change:transform}
.rw-unzoom{position:absolute;z-index:2;top:calc(var(--sat) + 20px);right:calc(var(--gr) + 8px);background:var(--popup);box-shadow:inset 0 0 0 1.5px var(--chip-b), var(--sh-pop)}
.rw-unzoom[hidden]{display:none}
.btn-sm{height:32px;padding:0 14px;font-size:14px}
.rw-sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 12px + var(--shot-h));display:flex;flex-direction:column;will-change:transform}
.sh-in{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:12px var(--gr) calc(16px + var(--sab)) var(--gl)}
.sh-h{display:none}
.tg-row{flex:none;display:flex;align-items:center;gap:10px;min-height:40px}
.tg-list{flex:0 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:5px;margin:-5px}
.tg-list::-webkit-scrollbar{display:none}
.tg{appearance:none;flex:none;height:40px;min-width:40px;padding:0 16px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--chip-b);color:var(--ink);font:700 15px/1 var(--font);transition:transform .14s var(--ease)}
.tg:active,.chip:active{transform:scale(.95)}
.tg[aria-pressed="true"]{background:var(--soft);color:var(--on-soft);box-shadow:inset 0 0 0 2.5px var(--accent)}
.tg-n{padding:0;width:40px;background:var(--pin);color:var(--pin-ink);box-shadow:none}
.tg-n[aria-pressed="true"]{background:var(--pin);color:var(--pin-ink);box-shadow:0 0 0 3px var(--bg), 0 0 0 5.5px var(--accent)}
.tg-hint{flex:1;min-width:0;margin:0;font:500 13px/16px var(--font);color:var(--muted)}
.tg-hint[hidden]{display:none}
#pinDel{margin-left:auto;flex:none;width:40px;height:40px;color:var(--muted)}
#pinDel[hidden]{display:none}
.ta-w{position:relative;flex:none;margin-top:10px}
.ta{display:block;width:100%;height:88px;resize:none;padding:8px 16px;border:0;border-radius:var(--r-card);
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--chip-b);color:var(--ink);font:400 16px/24px var(--font);-webkit-appearance:none;appearance:none}
.ta-w.has-mic .ta{padding-right:56px}
.ta::placeholder{color:var(--muted);opacity:1}
.ta:focus{outline:none;box-shadow:inset 0 0 0 2.5px var(--accent)}
.mic{position:absolute;right:6px;bottom:6px;width:40px;height:40px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:var(--soft);color:var(--on-soft);transition:transform .14s var(--ease), background-color .2s var(--ease)}
.mic[hidden]{display:none}
.mic:active{transform:scale(.92)}
.mic .ic{font-size:20px}
.mic[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);animation:micOn 1.3s var(--ease) infinite}
@keyframes micOn{from{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent)}to{box-shadow:0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent)}}
.sh-f{flex:none;display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:10px}
.sh-f .btn{height:44px}
.ph-list{flex:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.ph-list[hidden]{display:none}
.chip{appearance:none;height:36px;padding:0 13px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--chip-b);color:var(--ink2);font:600 14px/1 var(--font);transition:transform .14s var(--ease)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}

/* ---------- просмотр скриншота на весь экран ---------- */
.vw{position:fixed;z-index:60;inset:0;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}
.vw[hidden]{display:none}
.vw:not([hidden]){animation:vwIn .2s var(--ease)}
@keyframes vwIn{from{opacity:0}to{opacity:1}}
.vw-bg{position:absolute;inset:0;background:var(--bg)}
.vw-fit{position:absolute;inset:0;touch-action:none;cursor:grab}
.vw-frame{position:absolute}
.vw-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;min-height:56px;padding:calc(var(--sat) + 4px) var(--gr) 4px var(--gl);
  background:var(--bg);background:color-mix(in srgb, var(--bg) 84%, transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.vw-t{flex:1;min-width:0;margin:0;font:700 17px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-top .btn-icon{margin-right:-8px}
.vw-bar{position:absolute;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;
  border-radius:var(--r-pill);background:var(--popup);border:1px solid var(--border);box-shadow:var(--sh-pop)}
.vw-bar .btn{height:44px;padding:0 16px;font-size:15px}
.vw-bar .btn-icon{width:44px;padding:0}
.vw-bar .btn-icon .ic{font-size:20px}

/* ---------- широкий экран ---------- */
@media (min-width:900px){
  .hd{padding:calc(var(--sat) + 8px) 28px 8px}
  .main{padding:8px 28px 12px}
  .dock{grid-template-columns:auto 200px 200px auto;grid-template-rows:56px auto;column-gap:12px;row-gap:10px;justify-content:center;align-items:center;padding:0 28px calc(20px + var(--sab))}
  .dock-nav,.dock-dec{display:contents}
  .dock [data-nav="-1"]{grid-column:1;grid-row:1}
  .dock [data-act="fix"]{grid-column:2;grid-row:1}
  .dock [data-act="ok"]{grid-column:3;grid-row:1}
  .dock [data-nav="1"]{grid-column:4;grid-row:1}
  .dock-hint{display:block;grid-column:1 / -1;grid-row:2}
  .toast{left:50%;right:auto;width:440px;margin-left:-220px;bottom:calc(16px + var(--sab))}
  .done{padding-top:40px}
  .done-h{font-size:32px}

  /* группа «скриншот + панель» по центру, координаты задаёт RW.layout */
  .rw-stage{right:auto;height:auto;padding:24px 0 0}
  .rw-fit{flex:none}
  .vw-bar{bottom:calc(24px + var(--sab))}
  .rw-sheet{right:auto;top:24px;bottom:auto;width:424px;max-height:calc(100% - 48px)}
  .rw-unzoom{top:32px;right:8px}
  .sh-in{flex:0 1 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-pop);padding:24px}
  .sh-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .sh-h h2{margin:0;font:700 19px/1.3 var(--font);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tg-n[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface), 0 0 0 5.5px var(--accent)}
  .ta{height:128px}
}
@media (max-width:374px){
  .hd-t{font-size:16px}
  .bar{width:72px}
  .chip{padding:0 11px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- диктовка ---------- */
/* Распознаёт браузер: Chrome, Edge, Safari. Где микрофон не дают (браузер, настройки, рамка приложения),
   кнопка прячется и остаётся микрофон клавиатуры: поле уже в фокусе, клавиатура открыта. */

MIC.set = function(on){ var l = on ? 'Остановить диктовку' : 'Диктовать'; micBtn.setAttribute('aria-pressed', String(on)); micBtn.setAttribute('aria-label', l); micBtn.title = l; };

    var t = String(res[i][0] && res[i][0].transcript || '').trim(); if (!t) continue;

};

  r.onresult = function(e){
    if ((MIC.r !== r && MIC.late !== r) || !RW.on || RW.t !== MIC.t) return;
    var s = MIC.join(e.results); if (!s) return;
    if (!MIC.base || /[.!?]$/.test(MIC.base)) s = s.charAt(0).toUpperCase() + s.slice(1);
    rwTa.value = MIC.base ? MIC.base + ' ' + s : s; RW.input();

  r.onerror = function(e){ if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') MIC.fail(true); };
  r.onend = function(){ if (MIC.r === r) { MIC.r = null; MIC.set(false); } };

  MIC.stop(); MIC.off = true; MIC.show();

/* Документ решения по экрану: {status: 'ok'|'fix'|'', comment, tags, phrases, pins:[{x, y, text, phrases}], at}.

    pins:d.pins.map(function(p){ return {x:p.x, y:p.y, text:p.t, phrases:p.ph}; }), at:new Date().toISOString()};

    pins:arr(v.pins).map(function(p){ p = p || {}; return {x:clamp(+p.x || 0, 0, 1), y:clamp(+p.y || 0, 0, 1), t:typeof p.text === 'string' ? p.text : '', ph:arr(p.phrases)}; })};

  else store.timers[id] = setTimeout(function(){ store.timers[id] = 0; write(id); }, 700);
}
function persistAll(){ ITEMS.forEach(function(it){ persist(it.id, true); }); }
function write(id){
  if (store.mode === 'loading') { store.dirty[id] = true; return; }
  if (store.mode === 'local') { saveLocal(); return; }
  var body = toDoc(id);
  delete store.dirty[id];
  store.pending[id] = (store.pending[id] || 0) + 1; saveState();
  store.queue = store.queue.then(function(){
    if (store.mode === 'db') return store.db.collection('decisions').doc(id).set(body);
    return fetch(API + '/' + encodeURIComponent(id), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); });
  }).then(function(){
    store.pending[id]--;
    /* связь вернулась: дописать то, что не сохранилось раньше */
    Object.keys(store.dirty).forEach(function(k){ if (!store.timers[k]) write(k); });
    saveState();
  }, function(){
    store.pending[id]--; store.dirty[id] = true; saveState();
  });
}
function saveLocal(){
  var all = {};
  ITEMS.forEach(function(it){ if (st.dec[it.id]) all[it.id] = toDoc(it.id); });
  try { localStorage.setItem(LSD, JSON.stringify(all)); } catch (e) {}
}
function exportJson(){
  var out = {};
  ITEMS.forEach(function(it){ if (st.dec[it.id]) { var d = toDoc(it.id); d.code = it.code; d.title = it.title; out[it.id] = d; } });
  return JSON.stringify(out, null, 1);
}
function downloadDecisions(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exportJson()], {type:'application/json'}));
  a.download = KEY + '-decisions.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function saveState(){
  var busy = Object.keys(store.pending).some(function(k){ return store.pending[k] > 0; });
  var err = !busy && Object.keys(store.dirty).length > 0 && store.mode !== 'loading';
  var m = store.mode, t;
  if (m === 'loading') t = 'Подключаюсь к хранилищу';
  else if (m === 'local') t = 'Решения хранятся только в этом браузере. В конце скопируйте их' + (IN_ARTIFACT ? ' и вставьте в чат.' : ' или скачайте файл.');
  else if (busy) t = 'Сохраняю';
  else if (err) t = 'Часть решений не сохранилась. Проверьте связь, они сохранятся со следующим действием.';
  else t = m === 'file' ? 'Решения сохраняются в файл' : 'Решения сохраняются сами';
  var n = $('#saveNote'); n.textContent = t; n.classList.toggle('err', err);
  $('#download').hidden = IN_ARTIFACT || m === 'loading';
  var ds = $('#doneSave');
  if (ds) {
    ds.textContent = m === 'local' || err ? t : busy || m === 'loading' ? 'Сохраняю' : 'Решения сохранены. Напишите в чат «готово».';
    ds.classList.toggle('err', err);
  }
}
/* показать стопку с загруженными решениями: первый раз с первого нерешённого экрана, потом тот же экран,
   а если его решили на другом устройстве, то следующий нерешённый */
function refresh(changed){
  progress();
  if (RW.on || S.flying || S.drag || S.sx || S.su) return;
  var first = !store.shown; store.shown = true;
  var moved = changed && changed.indexOf(st.cur) >= 0 && D(st.cur).s;
  S.build(first || moved || !S.top ? startId() : st.cur);
}
function load(all){
  var changed = [];
  Object.keys(all || {}).forEach(function(id){
    if (!byId[id] || busyId(id)) return;
    var nd = fromDoc(all[id]);
    if (sig(nd) !== sig(D(id))) { st.dec[id] = nd; changed.push(id); }
  });
  return changed;
}
function ready(mode, all){
  store.mode = mode; load(all); refresh();
  Object.keys(store.dirty).forEach(function(k){ write(k); });
  saveState();
}
function useLocal(){
  var all = {};
  try { all = JSON.parse(localStorage.getItem(LSD) || '{}') || {}; } catch (e) {}
  ready('local', all);
}
function tryServer(){
  if (!/^https?:$/.test(location.protocol)) { useLocal(); return; }
  fetch(API, {cache:'no-store'}).then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(all){ ready('file', all); }, useLocal);
}
function useDb(db){
  store.db = db; store.mode = 'db'; saveState();
  var fallback = setTimeout(function(){ if (!store.shown) refresh(); }, 2500);
  db.collection('decisions').onSnapshot(function(snap){
    var all = {};
    snap.docs.forEach(function(doc){ if (doc.exists) all[doc.id] = doc.data(); });
    var changed = load(all);
    if (!store.shown) { clearTimeout(fallback); refresh(); Object.keys(store.dirty).forEach(function(k){ write(k); }); }
    else if (changed.length) refresh(changed);
    saveState();
  }, function(){ saveState(); });
}
function start(){
  if (!window.claude || typeof window.claude.use !== 'function') { tryServer(); return; }
  window.claude.use('db').then(function(db){ if (db) useDb(db); else useLocal(); }, useLocal);
}

/* ---------- старт ---------- */
onVV();
progress();
saveState();
start();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (store.shown && !RW.on && !S.flying && !S.drag && S.top) S.build(st.cur); });
})();
</script>
